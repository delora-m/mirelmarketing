<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Mirel Marketing</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#fbf7f1">

  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%231d0f0c'/%3E%3Ctext x='50' y='68' text-anchor='middle' font-size='58' font-family='Georgia' fill='%23fbf7f1'%3EM%3C/text%3E%3C/svg%3E"
  >

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:28px;

      background:
        linear-gradient(
          135deg,
          #fbf7f1,
          #efe3dc
        );

      font-family:Arial,sans-serif;
      color:#1d0f0c;
    }

    main{
      max-width:760px;
      text-align:center;
    }

    .brand{
      display:inline-flex;
      flex-direction:column;
      margin-bottom:55px;

      line-height:.9;
      letter-spacing:.32em;

      font-family:Georgia,serif;
      font-weight:600;
    }

    .brand span{
      font-size:34px;
    }

    .brand small{
      margin-top:9px;

      font-family:Arial,sans-serif;
      font-size:9px;
      letter-spacing:.46em;
    }

    .code{
      margin:0 0 14px;

      font-family:Georgia,serif;
      font-size:86px;
      font-weight:400;

      color:#a9686d;
    }

    h1{
      margin:0 0 20px;

      font-family:Georgia,serif;
      font-size:52px;
      line-height:1;
      font-weight:400;
    }

    p{
      max-width:570px;
      margin:0 auto 34px;

      font-size:15px;
      line-height:1.8;

      color:rgba(62,39,35,.72);
    }

    .actions{
      display:flex;
      justify-content:center;
      gap:12px;
      flex-wrap:wrap;
    }

    a.button{
      display:inline-flex;
      align-items:center;
      justify-content:center;

      min-height:54px;
      padding:0 28px;

      border:1px solid #3e2723;

      text-decoration:none;
      font-size:12px;
      font-weight:700;
    }

    a.primary{
      background:#1d0f0c;
      color:#fff;
    }

    a.secondary{
      background:#fffdf9;
      color:#3e2723;
    }

    a:focus-visible{
      outline:3px solid rgba(169,104,109,.72);
      outline-offset:4px;
    }

    @media(max-width:560px){

      .code{
        font-size:66px;
      }

      h1{
        font-size:40px;
      }

      .actions{
        flex-direction:column;
      }

      .button{
        width:100%;
      }

    }
  </style>
</head>

<body>

  <main>

    <a
      class="brand"
      href="index.html"
      aria-label="Mirel Marketing Home"
    >
      <span>MIRÈL</span>
      <small>MARKETING</small>
    </a>

    <p class="code">
      404
    </p>

    <h1>
      This page does not exist.
    </h1>

    <p>
      The path may have changed.
      Return to Mirel or go directly to the
      Med Spa Growth Strategy Review.
    </p>

    <div class="actions">

      <a
        class="button primary"
        href="index.html"
      >
        Return Home
      </a>

      <a
        class="button secondary"
        href="book.html"
      >
        Book Strategy Review
      </a>

    </div>

  </main>

</body>
</html>
