<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#fbf7f1">

  <!-- Contact is an intentional alias of the existing booking page.
       Keep a single clear conversion destination, rather than a duplicate form. -->
  <title>Contact Mirèl Partners | Growth Strategy Review</title>
  <link rel="canonical" href="https://mirelpartners.com/book.html">
  <meta http-equiv="refresh" content="0; url=book.html">

  <script>
    // Replace the current history entry so Back does not loop to this redirect.
    window.location.replace('book.html');
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #fbf7f1;
      color: #1d0f0c;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    main { max-width: 540px; }
    h1 { font-family: Georgia, serif; font-weight: 400; font-size: clamp(34px, 7vw, 52px); line-height: 1.1; }
    p { font-size: 15px; line-height: 1.7; color: #66534b; }
    a { color: #3e2723; text-underline-offset: 4px; }
    a:focus-visible { outline: 3px solid #a9686d; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Connect with Mirèl Partners.</h1>
    <p>Taking you to our Growth Strategy Review booking page.</p>
    <p>If the page does not open automatically, <a href="book.html">continue to booking</a> or email <a href="mailto:delora@mirelmarketing.com">delora@mirelmarketing.com</a>.</p>
  </main>
</body>
</html>
